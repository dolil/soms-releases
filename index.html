<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Download SOMS Desktop</title>
<meta name="description" content="Download the latest version of SOMS Desktop for Windows." />
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #f6faf7;
    --border: #e3e8ea;
    --text: #0f1f17;
    --muted: #5b6b62;
    --green: #16a34a;
    --green-dark: #15803d;
    --green-soft: #dcfce7;
    --green-tint: #f0fdf4;
    --shadow-sm: 0 1px 2px rgba(15, 31, 23, 0.04);
    --shadow-md: 0 4px 16px rgba(22, 163, 74, 0.08);
    --shadow-lg: 0 12px 40px rgba(22, 163, 74, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* Top bar */
  .nav {
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .nav-inner {
    max-width: 1040px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    text-decoration: none;
  }
  .brand-mark {
    width: 24px; height: 24px;
    background: var(--green);
    border-radius: 6px;
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 12px;
  }
  .nav a.gh {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
  }
  .nav a.gh:hover { color: var(--green-dark); }

  /* Hero */
  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 20px 32px;
  }
  .hero {
    text-align: center;
    padding: 0 8px 4px;
  }
  .hero .eyebrow {
    display: inline-block;
    background: var(--green-soft);
    color: var(--green-dark);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
    letter-spacing: 0.2px;
  }
  .hero h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }
  .hero p {
    margin: 0 auto 18px;
    max-width: 480px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Download card */
  .download-card {
    max-width: 520px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-md);
    text-align: left;
  }
  .download-card .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .version-block .version {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 1px;
  }
  .version-block .date {
    color: var(--muted);
    font-size: 12.5px;
  }
  .platform-pill {
    background: var(--green-tint);
    color: var(--green-dark);
    border: 1px solid var(--green-soft);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }

  .btn-download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: var(--green);
    color: #fff;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    box-shadow: var(--shadow-sm);
  }
  .btn-download:hover {
    background: var(--green-dark);
    box-shadow: var(--shadow-md);
  }
  .btn-download:active { transform: translateY(1px); }
  .btn-download svg { flex-shrink: 0; }

  .file-meta {
    display: flex;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .file-meta .sep { opacity: 0.5; }

  /* Release notes */
  .notes-wrap {
    max-width: 640px;
    margin: 22px auto 0;
  }
  .notes-wrap h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .notes {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #2a3a32;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 180px;
    overflow-y: auto;
  }

  /* States */
  .state {
    text-align: center;
    color: var(--muted);
    padding: 24px 16px;
    font-size: 14px;
  }
  .state.error {
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 14px;
    max-width: 520px;
    margin: 0 auto;
  }

  /* Footer */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 22px 16px 0;
  }
  footer a { color: var(--green-dark); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .container { padding: 18px 16px 24px; }
    .hero h1 { font-size: 24px; }
    .hero p { font-size: 13.5px; margin-bottom: 14px; }
    .download-card { padding: 16px; }
    .download-card .top { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">S</span>
      <span>SOMS Desktop</span>
    </a>
    <a class="gh" href="https://github.com/dolil/soms-releases" target="_blank" rel="noopener">View on GitHub &rarr;</a>
  </div>
</nav>

<div class="container">
  <section class="hero">
    <span class="eyebrow">Windows Installer</span>
    <h1>Download SOMS Desktop</h1>
    <p>Get the latest stable build of SOMS for Windows. One click, no setup hassle.</p>
  </section>

  <div id="content">
    <div class="state">Loading latest release&hellip;</div>
  </div>

  <footer>
    Released by <a href="https://github.com/dolil" target="_blank" rel="noopener">@dolil</a> &middot; Auto-published from CI
  </footer>
</div>

<script>
const REPO = "dolil/soms-releases";
const API = `https://api.github.com/repos/${REPO}/releases`;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function formatSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
  return (b / 1073741824).toFixed(2) + " GB";
}
function formatDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, {
    year: "numeric", month: "long", day: "numeric"
  });
}

// Only show Windows installer setup files (e.g. SOMS-Setup-1.0.0.exe)
function pickSetupAsset(release) {
  const assets = release.assets || [];
  return assets.find(a => /setup.*\.exe$/i.test(a.name))
      || assets.find(a => /\.exe$/i.test(a.name))
      || null;
}

function renderLatest(release) {
  const setup = pickSetupAsset(release);
  const version = release.tag_name || release.name;
  const notes = (release.body || "").trim();

  const downloadHtml = setup
    ? `
      <a class="btn-download" href="${escapeHtml(setup.browser_download_url)}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download for Windows
      </a>
      <div class="file-meta">
        <span>${escapeHtml(setup.name)}</span>
        <span class="sep">&bull;</span>
        <span>${formatSize(setup.size)}</span>
      </div>`
    : `<div class="state">No Windows installer in this release.</div>`;

  return `
    <div class="download-card">
      <div class="top">
        <div class="version-block">
          <p class="version">${escapeHtml(release.name || version)}</p>
          <p class="date">Released ${formatDate(release.published_at)}</p>
        </div>
        <span class="platform-pill">Windows &middot; .exe</span>
      </div>
      ${downloadHtml}
    </div>
    ${notes ? `
      <div class="notes-wrap">
        <h2>What&rsquo;s new</h2>
        <div class="notes">${escapeHtml(notes)}</div>
      </div>` : ""}
  `;
}

async function load() {
  const content = document.getElementById("content");
  try {
    const res = await fetch(`${API}/latest`, { headers: { Accept: "application/vnd.github+json" } });
    if (res.status === 404) {
      content.innerHTML = `<div class="state">No releases published yet. Check back soon.</div>`;
      return;
    }
    if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
    const latest = await res.json();
    content.innerHTML = renderLatest(latest);
  } catch (err) {
    content.innerHTML = `<div class="state error">Failed to load release: ${escapeHtml(err.message)}</div>`;
  }
}

load();
</script>

</body>
</html>
