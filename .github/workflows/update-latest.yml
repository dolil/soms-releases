name: Update download page feed

# The download page (index.html) used to call api.github.com from the visitor's browser.
# Anonymous callers get 60 requests per hour PER IP across the whole API, and every request
# after that is answered 403 — so the page died with "Failed to load release: GitHub API
# returned 403" for anyone sharing an address that had spent the quota.
#
# Instead the page reads latest.json from this repo, served by Pages from the same origin,
# and this job keeps that file in step with the releases.
#
# The release events do fire here: electron-builder publishes with a PAT
# (RELEASES_REPO_TOKEN in dolil/soms). Releases created with a workflow's default
# GITHUB_TOKEN would not trigger any workflow at all.

on:
  release:
    types: [published, edited, unpublished, deleted, released]
  workflow_dispatch:

concurrency:
  group: update-latest-feed

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # THE BRANCH, NOT THE TAG. A `release` event checks out the tag it fired for, which is a
      # detached HEAD — the job then builds latest.json correctly, commits it, and dies on `git push`
      # with "You are not currently on a branch". Pages serves `main`, so that is what this edits.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Describe the newest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same shape as the API response the page falls back to, trimmed to the fields it
          # renders — so index.html handles both sources with one code path.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                --jq '{tag_name, name, published_at, body, assets: [.assets[] | {name, size, browser_download_url}]}' \
                > latest.json.new; then
            echo "::warning::No published release to describe — leaving latest.json as it is."
            rm -f latest.json.new
            exit 0
          fi
          mv latest.json.new latest.json

      - name: Commit if it changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- latest.json)" ]; then
            echo "latest.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Point the download page at $(jq -r .tag_name latest.json)"
          git push
